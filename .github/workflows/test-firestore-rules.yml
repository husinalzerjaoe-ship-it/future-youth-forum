name: Validate Firestore Rules (No Deploy)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/v27-firestore-rules-audit
      - feature/v38-ultimate-all-in-one
      - feature/v40-full-community-release
      - feature/v47-shared-iptv-library
      - feature/v48-community-evolution
      - feature/v52-community-reels-stories
      - feature/v53-community-universe
      - feature/v54-world-community
      - feature/v58-experience-hub-full-upgrade
      - feature/v59-independent-vod-cinema-library
    paths:
      - 'firestore.rules'
      - 'rules-tests/**'
      - 'firebase.json'
      - '.github/workflows/test-firestore-rules.yml'

permissions:
  contents: read

jobs:
  rules-emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI and test dependencies
        run: |
          npm install --global firebase-tools
          npm --prefix rules-tests install --no-audit --no-fund

      - name: Run Firestore Emulator security tests
        run: firebase emulators:exec --only firestore --project demo-futureyouth-rules "npm --prefix rules-tests test"
