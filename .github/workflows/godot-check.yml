name: Godot project validation

on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  push:
    branches:
      - feature/godot-embedded-prototype
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Import and parse project
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot --quit

      - name: Run main scene headlessly
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --quit-after 5
