name: Deploy Firebase Security Rules

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v10-jitsi-backup-calls
      - feature/v12-futuristic-all-in
      - fix/v13-private-chat-and-rules-deploy
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase-rules.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Validate Firebase project configuration
        run: |
          test -f firebase.json
          test -f firestore.rules
      # Deploy Firestore independently: the Firebase Storage bucket is not
      # provisioned, so this workflow intentionally does not deploy Storage.
      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project futureyouth-69f8a --non-interactive
