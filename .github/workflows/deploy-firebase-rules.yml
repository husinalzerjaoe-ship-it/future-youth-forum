name: Deploy Firebase Security Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase-rules.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Show deployment service account
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Firebase deploy service account: $(printf '%s' "$FIREBASE_SA_JSON" | jq -r '.client_email')"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Firebase project configuration
        run: |
          test -f firebase.json
          test -f firestore.rules

      - name: Deploy Firestore security rules
        run: |
          firebase deploy --only firestore:rules --project futureyouth-69f8a --non-interactive || {
            echo "Firestore rules deployment failed. Check that the service account has Firebase Rules Admin (roles/firebaserules.admin)."
            exit 1
          }
