name: Deploy Firebase Security Rules

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v10-jitsi-backup-calls
      - feature/v22-cinema-2025-2026-discovery
      - feature/v35-comprehensive-community-upgrade
      - feature/v38-ultimate-all-in-one
      - feature/v40-full-community-release
      - feature/v47-shared-iptv-library
      - feature/v48-community-evolution
      - feature/v49-complete-community-upgrade
      - feature/v52-community-reels-stories
      - feature/v53-community-universe
      - feature/v54-world-community
      - feature/v55-music-notifications-repair
      - feature/v58-experience-hub-full-upgrade
      - feature/v59-independent-vod-cinema-library
      - feature/v60-complete-forum-upgrade
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'rules-tests/**'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase-rules.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for rules tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI and rules test dependencies
        run: |
          npm install --global firebase-tools
          npm --prefix rules-tests install --no-audit --no-fund

      - name: Run Firestore security rules emulator tests
        run: firebase emulators:exec --only firestore --project demo-futureyouth-rules "npm --prefix rules-tests test"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Validate Firebase project configuration
        run: |
          test -f firebase.json
          test -f firestore.rules

      # V27 is manual-dispatch only: pushing this branch never changes live rules.
      # The selected branch is checked out, emulator tests run, then Firestore rules and indexes deploy.
      # Firebase Storage has not been initialized for this project. Deploy Firestore
      # rules now; deploy storage.rules only after a bucket is provisioned.
      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project futureyouth-69f8a --non-interactive
