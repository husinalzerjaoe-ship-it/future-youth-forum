name: Flutter quality check and Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, fix/media-private-chat-reactions]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-apk-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Firebase Functions syntax
        run: node --check functions/index.js
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.futureyouth --project-name forum .
      - name: Set Android app display name
        run: sed -i 's/android:label="forum"/android:label="ملتقى الأنمي"/' android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: future-youth-forum-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
