name: Flutter quality check and Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, release/combined-mainline, 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Firebase Functions syntax
        run: node --check functions/index.js
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.futureyouth --project-name forum .
      - name: Set Android compile SDK to 36
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          for path in candidates:
              if not path.exists():
                  continue
              content = path.read_text()
              if path.suffix == '.kts':
                  content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              else:
                  content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              path.write_text(content)
              print(f'Updated {path} to compile SDK 36')
              break
          else:
              raise SystemExit('Android app Gradle file not found')
          PY
      - name: Force Android library plugins to compile with SDK 36
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-android-compile-sdk.gradle" <<'GRADLE'
          allprojects {
              afterEvaluate { project ->
                  def androidExtension = project.extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion(36)
                      println("Forced compileSdk 36 for ${project.path}")
                  }
              }
          }
          GRADLE
      - name: Configure Android background audio
        run: python scripts/configure_android_audio.py
      - name: Set Android app display name
        run: sed -i 's/android:label="forum"/android:label="ملتقى شباب المستقبل"/' android/app/src/main/AndroidManifest.xml
      - name: Configure Future Youth Forum launcher icon
        run: python scripts/configure_android_branding.py
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: future-youth-forum-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
